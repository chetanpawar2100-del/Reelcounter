<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReelCounter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }
    .card {
      max-width: 400px;
      margin: 40px auto;
      padding: 25px;
      background: #1f2937;
      border-radius: 20px;
    }
    h1 { color: #a78bfa; }
    #count {
      font-size: 70px;
      margin: 25px;
    }
    button {
      padding: 15px 25px;
      margin: 8px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }
    .add { background: #8b5cf6; color: white; }
    .reset { background: #374151; color: white; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎬 ReelCounter</h1>
    <p>Count the reels you watch!</p>
    <div id="count">0</div>
    <button class="add" onclick="addReel()">+1 Reel</button>
    <button class="reset" onclick="resetCount()">Reset</button>
    <p id="message">Start counting your reels!</p>
  </div>

  <script>
    let count = Number(localStorage.getItem("reelCount")) || 0;
    showCount();

    function addReel() {
      count++;
      localStorage.setItem("reelCount", count);
      showCount();
    }

    function resetCount() {
      count = 0;
      localStorage.setItem("reelCount", count);
      showCount();
    }

    function showCount() {
      document.getElementById("count").textContent = count;
      document.getElementById("message").textContent =
        count + " reels counted!";
    }
  </script>
</body>
</html>
